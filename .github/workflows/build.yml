name: "Build"
permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: ".NET App"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./src
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, windows-2022, macos-latest ]

    steps:
      - name: 🚚 Checkout latest
        uses: actions/checkout@v7

      - name: 🧲 Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            9.0.x
            10.0.x

      - name: 📦 Install dependencies
        run: dotnet restore

      - name: 🔨 Build
        run: dotnet build --no-restore

      - name: 🧐 Test
        run: dotnet test --no-build --verbosity normal --filter "FullyQualifiedName!~IntegrationTests"

      - name: 🔍 Check generated API clients
        if: runner.os == 'Linux'
        run: |
          dotnet run --no-build --project Apps/NetPad.Apps.App -- --swagger
          if ! git diff --quiet -- "Apps/NetPad.Apps.App/App/src/core/@application/api.ts" "Apps/NetPad.Apps.App/App/src/core/@plugins/*/api.ts"; then
            echo "::error::Generated API clients are out of date. Run 'just dotnet-ts-gen' and commit the changes."
            git diff --stat
            exit 1
          fi

  spa:
    name: "SPA App"
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ./src/Apps/NetPad.Apps.App/App

    strategy:
      matrix:
        node-version: [ 22.x ]

    steps:
      - name: 🚚 Checkout latest
        uses: actions/checkout@v7

      - name: 🧲 Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: src/Apps/NetPad.Apps.App/App/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 Lint
        run: npm run lint

      - name: 🔨 Build
        run: npm run build

      - name: 🧐 Test
        run: npm test

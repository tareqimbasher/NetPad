<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>NetPad</title>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <base href="/">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png"/>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"/>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script>
        // Paint the window in the last-used theme before the SPA loads its settings, so opening a
        // window doesn't flash the wrong color. Written by ThemeBootCache (theme-boot-cache.ts),
        // which also owns the key and payload shape.
        (function () {
            try {
                var cached = JSON.parse(localStorage.getItem("netpad.theme.boot"));
                if (!cached || !cached.cssClasses || !cached.groundColor) return;
                document.documentElement.className = cached.cssClasses;
                document.documentElement.style.backgroundColor = cached.groundColor;
            } catch {
                // No cache, no pre-boot paint.
            }
        })();
    </script>
</head>

<body>
</body>

</html>

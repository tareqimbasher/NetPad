<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>NetPad</title>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <base href="/">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png"/>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"/>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script>
        // Paint the window as early as possible (before the SPA loads its settings) using the last-used theme so
        // the window doesn't flash the wrong color. The cached localStorage value is written by ThemeBootCache.
        (function () {
            try {
                const cached = JSON.parse(localStorage.getItem("netpad.theme.boot"));
                if (!cached) return;
                const ground = cached.mode === "Dark" ? "dark"
                    : cached.mode === "Light" ? "light"
                        : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                const entry = cached[ground];
                if (!entry || !entry.cssClasses || !entry.groundColor) return;
                document.documentElement.className = entry.cssClasses;
                document.documentElement.style.backgroundColor = entry.groundColor;
            } catch {
                // ignore
            }
        })();
    </script>
</head>

<body>
</body>

</html>

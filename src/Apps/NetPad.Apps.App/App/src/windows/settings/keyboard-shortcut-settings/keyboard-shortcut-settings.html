<template>
    <div class="shortcut-filter-row">
        <div class="search-field flex-1">
            <np-icon name="search"></np-icon>
            <input type="text"
                   value.bind="filter & debounce:150"
                   placeholder="Filter shortcuts…"
                   spellcheck="false">
        </div>
        <span class="shortcut-count">${visibleShortcuts.length} shortcuts</span>
    </div>

    <div class="shortcut-header label-caps">
        <span click.trigger="order('description')">
            Action
            <np-icon show.bind="orderBy === 'description'"
                     name.bind="orderDir === 'asc' ? 'arrow-up' : 'arrow-down'"></np-icon>
        </span>
        <span class="ms-auto" click.trigger="order('keys')">
            Shortcut
            <np-icon show.bind="orderBy === 'keys'"
                     name.bind="orderDir === 'asc' ? 'arrow-up' : 'arrow-down'"></np-icon>
        </span>
    </div>

    <div class="shortcut-list flex-grow-height-restricted">
        <div class="shortcut-row" repeat.for="shortcut of visibleShortcuts">
            <span class="shortcut-name text-truncate">${shortcut.name}</span>
            <span class="shortcut-actions">
                <np-icon name="edit"
                         class="action-icon row-action"
                         title="Change shortcut"
                         click.trigger="editKeyCombo(shortcut)"></np-icon>
                <np-icon name="reset"
                         class="action-icon row-action"
                         if.bind="!shortcut.isDefault"
                         title="Reset to default"
                         click.trigger="reset(shortcut)"></np-icon>
                <span class="modified-dot" if.bind="!shortcut.isDefault" title="Changed from the default"></span>
            </span>
            <kbd if.bind="shortcut.keyCombo.isBound">${shortcut.keys}</kbd>
            <span else class="shortcut-unassigned">Unassigned</span>
        </div>
    </div>
</template>

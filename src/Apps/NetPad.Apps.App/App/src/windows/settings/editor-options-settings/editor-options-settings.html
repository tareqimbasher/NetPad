<span class="group-label">Editor</span>
<div class="setting-group">
    <div class="setting-row">
        <div class="setting-info">
            <div class="setting-title">Vim keybindings</div>
            <div class="setting-description">Toggle vim mode in the editor with ${vimModeKeyCombo}.</div>
        </div>
        <div class="setting-control">
            <span class="chip chip-warn">experimental</span>
            <input type="checkbox" class="toggle-switch" checked.bind="settings.editor.vim.enabled">
        </div>
    </div>

    <div class="setting-row">
        <div class="setting-info">
            <div class="setting-title">Editor theme</div>
            <div class="setting-description">Auto follows the app theme.</div>
        </div>
        <div class="setting-control">
            <select class="form-select" value.bind="theme" style="width: 220px">
                <option value="">Auto</option>
                <option repeat.for="editorTheme of getThemes()" value.bind="editorTheme.id">${editorTheme.name}</option>
            </select>
        </div>
    </div>
</div>

<span class="group-label">Options (JSON)</span>
<div class="editor-card">
    <div class="editor-card-header">
        <span>Anything the Monaco editor accepts.</span>
        <a href="https://microsoft.github.io/monaco-editor/typedoc/interfaces/editor.IEditorOptions.html"
           external-link
           class="ms-auto">Options reference</a>
    </div>
    <div class="editor-card-body">
        <div class="text-editor" id="options-editor"></div>
    </div>
</div>

<div class="section text-muted d-flex">
    <span class="warning-icon text-yellow me-3"></span>
    <p class="flex-grow-1 m-0">
        ${'settings.omnisharp.restartNotePre' | t}<code>${'ui.restart-omnisharp-server' | t}</code>${'settings.omnisharp.restartNotePost' | t}
    </p>
</div>

<div class="section">
    <div class="header">
        <i class="code-icon text-green"></i>
        ${'settings.omnisharp.general' | t}
    </div>

    <div class="body">
        <div class="body flex-grow-height-restricted">
            <div class="d-flex mt-3">
                <label for="omnisharpExePath" class="form-label" style="min-width: 180px">${'settings.omnisharp.customExecutablePath' | t}</label>
                <div class="flex-grow-1">
                    <input type="text"
                           class="form-control"
                           id="omnisharpExePath"
                           placeholder="${'settings.omnisharp.customExecutablePath.placeholder' | t}"
                           spellcheck="false">
                    <div class="form-text">
                        ${'settings.omnisharp.customExecutablePath.hint' | t}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="section">
    <div class="header">
        <i class="settings-icon"></i>
        ${'settings.omnisharp.options' | t}
    </div>

    <div class="body">
        <div class="form-check" repeat.for="option of options">
            <input id="omnisharp-option-${$index}"
                   class="form-check-input"
                   type="checkbox"
                   checked.bind="option.value">
            <label class="form-check-label" for="omnisharp-option-${$index}">
                ${option.label}
                <span class="form-text" show.bind="option.description">
                    <br/>
                    ${option.description}
                </span>
            </label>
        </div>
    </div>
</div>

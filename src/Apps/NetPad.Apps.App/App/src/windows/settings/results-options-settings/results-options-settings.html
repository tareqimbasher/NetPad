<div class="section">
    <div class="header">
        <i class="settings-icon"></i>
        ${'settings.results.options' | t}
    </div>
    <div class="body">
        <div class="form-check">
            <input id="openOnRun"
                   class="form-check-input"
                   type="checkbox"
                   checked.bind="settings.results.openOnRun">
            <label class="form-check-label" for="openOnRun">
                ${'settings.results.openOnRun' | t}
            </label>
        </div>
        <div class="form-check">
            <input id="textWrap"
                   class="form-check-input"
                   type="checkbox"
                   checked.bind="settings.results.textWrap">
            <label class="form-check-label" for="textWrap">
                ${'settings.results.textWrap' | t}
            </label>
        </div>
    </div>
</div>

<div class="section">
    <div class="header">
        <i class="results-serialization-settings-icon"></i>
        ${'settings.results.serialization' | t}
    </div>

    <div class="body">
        <div class="row">
            <label class="col-3 col-form-label fw-bold"
                   for="max-depth-input"
                   title="${'settings.results.maxDepth.title' | t}">
                ${'settings.results.maxDepth' | t}
            </label>
            <div class="col-9">
                <input type="number"
                       id="max-depth-input"
                       class="form-control d-inline-block"
                       value.bind="settings.results.maxSerializationDepth"
                       placeholder="${'ui.default-64' | t}"
                       min="1"
                       max="1000"
                       oninput="validity.valid||(value='');"
                       style="max-width: 130px">
                <span class="text-muted">
                    ${'settings.results.maxDepth.max' | t}
                </span>
            </div>
        </div>
        <div class="row mt-2">
            <label class="col-3 col-form-label fw-bold"
                   for="max-collection-length"
                   title="${'settings.results.maxCollectionLength.title' | t}">
                ${'settings.results.maxCollectionLength' | t}
            </label>
            <div class="col-9">
                <input type="number"
                       id="max-collection-length"
                       class="form-control d-inline-block"
                       value.bind="settings.results.maxCollectionSerializeLength"
                       placeholder="${'ui.default-1000' | t}"
                       min="1"
                       max="100000"
                       oninput="validity.valid||(value='');"
                       style="max-width: 130px">
                <span class="text-muted">
                    ${'settings.results.maxCollectionLength.hint' | t}
                </span>
            </div>
        </div>
    </div>
</div>

<div class="section">
    <div class="header">
        <i class="theme-icon"></i>
        ${'settings.results.appearance' | t}
    </div>

    <div class="body">
        <div class="sub-header">${'settings.results.font' | t}</div>
        <div class="body">
            <div class="form-check">
                <input id="font-system"
                       name="font"
                       class="form-check-input"
                       type="radio"
                       model.bind=""
                       checked.bind="settings.results.font">
                <label class="form-check-label" for="font-system">
                    ${'settings.results.font.system' | t}
                </label>
            </div>
            <div class="form-check">
                <input id="font-monospace"
                       name="font"
                       class="form-check-input"
                       type="radio"
                       model.bind="'monospace'"
                       checked.bind="settings.results.font">
                <label class="form-check-label" for="font-monospace" style="font-family: monospace">
                    ${'settings.results.font.monospace' | t}
                </label>
            </div>
        </div>
    </div>
</div>

<div class="drag-drop-container" ref="tabContainer">
    <div class="view-tab ${viewable.id === active.id ? 'active' : ''} ${viewable.statusIndicator ? 'status-' + viewable.statusIndicator : ''}"
         repeat.for="viewable of orderedViewables"
         data-id.bind="viewable.id"
         data-name.bind="viewable.name"
         title.bind="viewable.tooltip">
        <div class="view-tab-content"
             click.trigger="activate(viewable)"
             auxclick.trigger="close(viewable, $event)">

            <span class="state-dot ${viewable.statusIndicator || ''}"
                  if.bind="settings.appearance.showScriptRunStatusIndicatorInTab"
                  title.bind="statusTitle(viewable)"></span>

            <div class="script-name">
                <span if.bind="viewable.kindBadge"
                      class="kind-badge">${viewable.kindBadge}</span>
                ${viewable.name}
                <np-icon if.bind="viewable.subtitleIcon"
                         name.bind="viewable.subtitleIcon"
                         class="connection-glyph ${viewable.hasProductionWarning ? 'is-production' : ''}"
                         title="${viewable.subtitle}"></np-icon>
            </div>
        </div>
        <div class="view-tab-addon ${viewable.isDirty ? 'is-dirty' : ''}">
            <span class="state-dot dirty dirty-flag" title="Unsaved changes"></span>
            <np-icon name="close" class="view-tab-close-button"
               title="${shortcutManager.getShortcutByName('Close').toString()}"
               click.trigger="close(viewable)"></np-icon>
        </div>
    </div>
</div>

<div class="view-tab new-tab"
     click.trigger="new()"
     title="${shortcutManager.getShortcutByName('New').toString()}">
    <np-icon name="add"></np-icon>
</div>

<context-menu options.bind="tabContextMenuOptions"></context-menu>

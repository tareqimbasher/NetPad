<template>
    <div class="tb-actions">
        <button class="run-button btn"
                show.bind="!isBusy"
                title="${getShortcutKeyCombo('Run')}"
                click.trigger="run()">
            <np-icon name="run"></np-icon>
            Run
            <kbd>${getShortcutKeys('Run')}</kbd>
        </button>
        <button class="stop-button btn"
                show.bind="environment.status === 'Running' || environment.status === 'Stopping'"
                title="Stop"
                click.trigger="stop()"
                disabled.bind="environment.status === 'Stopping'">
            <np-icon name="stop"></np-icon>
            Stop
        </button>
        <button class="toolbar-icon-button btn"
                title="${getShortcutKeyCombo('Save')}${environment.script.isDirty ? ': there are unsaved changes' : ''}"
                click.trigger="save()"
                disabled.bind="isBusy || !environment.script.isDirty">
            <np-icon name="save" class="${environment.script.isDirty ? 'is-dirty' : ''}"></np-icon>
        </button>
    </div>

    <span class="toolbar-divider"></span>

    <label class="pv" title="The .NET SDK to use for this script.">
        <span class="pv-label">SDK</span>
        <select class="pv-value dotnet-runtime-selector"
                value.bind="targetFrameworkVersion"
                disabled.bind="isBusy">
            <option value="" disabled></option>
            <option if.bind="targetFrameworkVersion && !availableFrameworkVersions.includes(targetFrameworkVersion)"
                    value.bind="targetFrameworkVersion" disabled>
                .NET ${targetFrameworkVersion.replace('DotNet', '')} (not installed)
            </option>
            <option value.bind="framework" repeat.for="framework of availableFrameworkVersions">
                .NET ${framework.replace('DotNet', '')}
            </option>
        </select>
    </label>

    <label class="pv">
        <span class="pv-label">Kind</span>
        <select class="pv-value script-kind-selector"
                value.bind="kind"
                disabled.bind="isBusy">
            <option value="Program">C# Program</option>
            <option value="SQL">SQL</option>
        </select>
    </label>

    <label class="pv" title="Compiler optimizations (Optimize -/+)">
        <span class="pv-label">Optimize</span>
        <select class="pv-value optimization-level-selector"
                value.bind="optimizationLevel"
                disabled.bind="isBusy">
            <option value="Debug" title="Optimize-: Optimizations disabled.">Debug</option>
            <option value="Release" title="Optimize+: Optimizations enabled.">Release</option>
        </select>
    </label>

    <label class="pv ${script.dataConnection ? 'has-value' : ''}">
        <span class="pv-label">Connection</span>
        <select class="pv-value data-connection-selector"
                value.bind="dataConnection"
                disabled.bind="isBusy">
            <option model.bind="null">None</option>
            <option repeat.for="connection of dataConnectionStore.connections"
                    model.bind="connection">
                ${connection.name} (${connection.type})
            </option>
        </select>
    </label>

    <div class="tb-end">
        <a class="chip refs-chip"
           title="Click to go to References"
           click.trigger="openProperties()">
            ${script.config.references.length} ref${script.config.references.length == 1 ? '' : 's'}
        </a>
        <button class="toolbar-icon-button btn"
                title="${getShortcutKeyCombo('Script Properties')}"
                click.trigger="openProperties()"
                disabled.bind="isBusy">
            <np-icon name="properties"></np-icon>
        </button>
    </div>
</template>

<template>
    <div class="tb-actions">
        <button class="run-button btn"
                show.bind="!isBusy"
                title="${tooltip(commandIds.runScript)}"
                click.trigger="run()">
            <np-icon name="run"></np-icon>
            Run
            <kbd>${keys(commandIds.runScript)}</kbd>
        </button>
        <button class="stop-button btn"
                show.bind="environment.status === 'Running' || environment.status === 'Stopping'"
                title="${tooltip(commandIds.stopScript)}"
                click.trigger="stop()"
                disabled.bind="environment.status === 'Stopping'">
            <np-icon name="stop"></np-icon>
            Stop
        </button>
        <button class="toolbar-icon-button btn"
                title="${tooltip(commandIds.saveScript)}${environment.script.isDirty ? ': there are unsaved changes' : ''}"
                click.trigger="save()"
                disabled.bind="isBusy || !environment.script.isDirty">
            <np-icon name="save" class="${environment.script.isDirty ? 'is-dirty' : ''}"></np-icon>
        </button>
    </div>

    <span class="toolbar-divider"></span>

    <span class="pv" title="The .NET SDK to use for this script.">
        <label class="pv-label" for.bind="sdkSelect.controlElementId">SDK</label>
        <np-value-select class="pv-value dotnet-runtime-selector"
                         view-model.ref="sdkSelect"
                         label="SDK"
                         options.bind="sdkOptions"
                         value.bind="targetFrameworkVersion"
                         disabled.bind="isBusy"></np-value-select>
    </span>

    <span class="pv">
        <label class="pv-label" for.bind="kindSelect.controlElementId">Kind</label>
        <np-value-select class="pv-value script-kind-selector"
                         view-model.ref="kindSelect"
                         label="Script kind"
                         options.bind="kindOptions"
                         value.bind="kind"
                         disabled.bind="isBusy"></np-value-select>
    </span>

    <span class="pv" title="Compiler optimizations (Optimize -/+)">
        <label class="pv-label" for.bind="optimizeSelect.controlElementId">Optimize</label>
        <np-value-select class="pv-value optimization-level-selector"
                         view-model.ref="optimizeSelect"
                         label="Optimize"
                         options.bind="optimizationOptions"
                         value.bind="optimizationLevel"
                         disabled.bind="isBusy"></np-value-select>
    </span>

    <span class="pv">
        <label class="pv-label" for.bind="connectionSelect.controlElementId">Connection</label>
        <np-value-select class="pv-value data-connection-selector"
                         view-model.ref="connectionSelect"
                         label="Data connection"
                         options.bind="dataConnectionOptions"
                         value.bind="dataConnection"
                         disabled.bind="isBusy"></np-value-select>
        <span class="prod-pill"
              if.bind="targetsProductionData"
              title="This connection holds production data. Anything you run reaches it.">PROD</span>
    </span>

    <div class="tb-end">
        <a class="chip refs-chip"
           title="Click to go to References"
           click.trigger="openProperties()">
            ${script.config.references.length} ref${script.config.references.length == 1 ? '' : 's'}
        </a>
        <button class="toolbar-icon-button btn"
                title="${tooltip(commandIds.openScriptProperties)}"
                click.trigger="openProperties()"
                disabled.bind="isBusy">
            <np-icon name="properties"></np-icon>
        </button>
    </div>
</template>

<template class="d-flex align-items-center overflow-x-auto">
    <div class="group gap-2">
        <button class="run-button btn btn-sm btn-themed"
                show.bind="!isBusy"
                title="${getShortcutKeyCombo('Run')}"
                click.trigger="run()">
            <i class="run-icon"></i>
        </button>
        <button class="stop-button btn btn-sm btn-themed"
                show.bind="environment.status === 'Running' || environment.status === 'Stopping'"
                title="${'ui.stop' | t}"
                click.trigger="stop()"
                disabled.bind="environment.status === 'Stopping'">
            <i class="stop-icon"></i>
        </button>
        <button class="toolbar-icon-button btn btn-sm"
                title="${getShortcutKeyCombo('Save')}${environment.script.isDirty ? ': there are unsaved changes' : ''}"
                click.trigger="save()"
                disabled.bind="isBusy || !environment.script.isDirty">
            <i class="save-icon ${environment.script.isDirty ? 'is-dirty' : ''}"></i>
        </button>
        <button class="toolbar-icon-button btn btn-sm"
                title="${getShortcutKeyCombo('Script Properties')}"
                click.trigger="openProperties()"
                disabled.bind="isBusy">
            <i class="properties-icon"></i>
        </button>
    </div>
    <span class="toolbar-divider ms-2"></span>
    <div class="group" title="${'ui.the-net-sdk-to-use-for-this-script' | t}">
        <span class="group-label">${'ui.sdk' | t}</span>
        <select class="form-select form-select-sm dotnet-runtime-selector ms-3"
                value.bind="targetFrameworkVersion"
                disabled.bind="isBusy">
            <option value="" disabled></option>
            <option if.bind="targetFrameworkVersion && !availableFrameworkVersions.includes(targetFrameworkVersion)"
                    value.bind="targetFrameworkVersion" disabled>
                .NET ${targetFrameworkVersion.replace('DotNet', '')} (not installed)
            </option>
            <option value.bind="framework" repeat.for="framework of availableFrameworkVersions">
                .NET ${framework.replace('DotNet', '')}
            </option>
        </select>
    </div>
    <div class="group">
        <span class="group-label">${'ui.kind' | t}</span>
        <select class="form-select form-select-sm script-kind-selector ms-3"
                value.bind="kind"
                disabled.bind="isBusy">
            <option value="Program">${'ui.c-program' | t}</option>
            <option value="SQL">SQL</option>
        </select>
    </div>
    <div class="group"
         title="${'ui.compiler-optimizations-optimize' | t}">
        <span class="group-label">${'ui.optimize' | t}</span>
        <select class="form-select form-select-sm optimization-level-selector ms-3"
                value.bind="optimizationLevel"
                disabled.bind="isBusy">
            <option value="Debug" title="${'ui.optimize-optimizations-disabled' | t}">${'ui.debug' | t}</option>
            <option value="Release" title="${'ui.optimize-optimizations-enabled' | t}">${'ui.release' | t}</option>
        </select>
    </div>
    <div class="group">
        <span class="group-label">${'ui.connection-2' | t}</span>
        <select class="form-select form-select-sm data-connection-selector ms-3"
                value.bind="dataConnection"
                disabled.bind="isBusy">
            <option model.bind="null">${'ui.none' | t}</option>
            <option repeat.for="connection of dataConnectionStore.connections"
                    model.bind="connection">
                ${connection.name} (${connection.type})
            </option>
        </select>
    </div>
    <div class="ms-auto me-3 text-truncate" title="${'ui.click-to-go-to-references' | t}">
        <a class="btn btn-sm ${script.config.references.length ? 'btn-secondary' : 'btn-outline-secondary'}"
           click.trigger="openProperties()">
            ${script.config.references.length} ${(script.config.references.length === 1 ? 'ui.reference' : 'ui.references') | t}
        </a>
    </div>
</template>

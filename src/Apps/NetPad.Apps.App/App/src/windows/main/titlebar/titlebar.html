<import from="./integrated-main-menu/integrated-main-menu"></import>

<div class="np-mark" title="NetPad">NP</div>

<integrated-main-menu></integrated-main-menu>

<div class="title" data-tauri-drag-region>
    <span class="title-text">${title}</span>
</div>

<div class="actions">
    <np-icon name="app-update" class="action-icon"
       click.trigger="openAppUpdateDialog()"
       title="Update available"
       if.bind="appService.appHasUpdate"></np-icon>
    <np-icon name="window-always-on-top" class="action-icon ${windowState.isAlwaysOnTop ? 'active' : ''}"
       shells="!browser"
       click.trigger="toggleWindowAlwaysOnTop()"
       title="${windowState.isAlwaysOnTop ? 'Disable' : 'Enable'} Always on Top"></np-icon>
    <np-icon name="settings" class="action-icon"
       click.trigger="openSettingsWindow()"
       title="${shortcutManager.getShortcutByName('Settings').toString()}"></np-icon>
</div>

<div class="window-controls ${leftWinCtrls ? 'order-first' : ''}" shells="!browser">
    <np-icon name="window-minimize" class="action-icon ${leftWinCtrls ? 'order-last' : ''}"
       click.trigger="minimize()"
       title="Minimize"></np-icon>
    <np-icon name.bind="windowState.isMaximized ? 'window-restore' : 'window-maximize'" class="action-icon"
       click.trigger="maximize()"
       title="${windowState.isMaximized ? 'Restore' : 'Maximize'}"></np-icon>
    <np-icon name="window-close" class="action-icon close-button ${leftWinCtrls ? 'order-first' : ''}"
       click.trigger="close()"
       title="Close"></np-icon>
</div>

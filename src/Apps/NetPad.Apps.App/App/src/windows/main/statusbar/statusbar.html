<div class="statusbar-container">
    <div class="left-column">
        <div class="grp script-status" title="${activeEnvironment.status}">
            <span class="state-dot ${activeStateDot}"></span>
            ${activeEnvironment.status}${runDuration !== null && activeEnvironment.status !== 'Running' ? ' · took ' + runDuration : ''}
        </div>

        <div class="grp"
             repeat.for="item of workbench.statusbarService.items.filter(i => i.position === 'left')">
            <au-compose component.bind="item.component"
                        class="statusbar-item"></au-compose>
        </div>
    </div>
    <div class="middle-column">
        <let message.bind="notificationService.statusBarMessage"></let>
        <div class="active-app-status-message text-truncate-1-line"
             show.bind="message"
             contextmenu.trigger="dismissStatusBarMessage($event)"
             title="Right click to dismiss">
            <np-icon name.bind="icon(message.severity)" class="${textClass(message.severity)} pe-2"></np-icon>
            ${message.scriptName ? '[' + message.scriptName + ']:' : ''} ${message.text}
        </div>
    </div>
    <div class="right-column">
        <div class="grp background-script"
             if.bind="backgroundRunning.length"
             title.bind="backgroundRunningTooltip">
            ${backgroundRunningLabel} · running
            <span class="state-dot running"></span>
        </div>

        <div class="grp"
             repeat.for="item of workbench.statusbarService.items.filter(i => i.position === 'right')">
            <au-compose component.bind="item.component"
                        class="statusbar-item"></au-compose>
        </div>

        <div class="actions">
            <np-icon name="quick-tips" class="action-icon"
               click.trigger="showQuickTipsDialog()"
               title="Quick Tips"></np-icon>
            <np-icon name="app-deps-check" class="action-icon"
               click.trigger="showAppDepsCheckDialog()"
               title="App Dependencies Check"></np-icon>
            <np-icon name="theme" class="action-icon"
               click.trigger="settingsService.toggleTheme()"
               title="Toggle Theme"></np-icon>
            <np-icon name="settings" class="action-icon"
               if.bind="settings.appearance.titlebar.type === 'Native' & oneTime"
               click.trigger="settingsService.openSettingsWindow()"
               title="${shortcutManager.getShortcutByName('Settings').toString()}"></np-icon>
        </div>
    </div>
</div>

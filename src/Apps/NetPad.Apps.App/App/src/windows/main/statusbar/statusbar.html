<div class="statusbar-container status-${activeEnvironment.status.toLowerCase()}">
    <div class="left-column">
        <div class="script-status">${activeEnvironment.status}</div>

        <div show.bind="activeEnvironment.status !== 'Running' && runDuration !== null"
             title="${'ui.the-time-it-took-to-run-the-script-in-milliseconds' | t}">
            (Took: ${runDuration})
        </div>

        <div repeat.for="item of workbench.statusbarService.items.filter(i => i.position === 'left')">
            <au-compose component.bind="item.component"
                        class="statusbar-item"></au-compose>
        </div>
    </div>
    <div class="middle-column">
        <let message.bind="notificationService.statusBarMessage"></let>
        <div class="active-app-status-message text-truncate-1-line"
             show.bind="message"
             contextmenu.trigger="dismissStatusBarMessage($event)"
             title="${'ui.right-click-to-dismiss' | t}">
            <i class="${iconClass(message.severity)} ${textClass(message.severity)} pe-2"></i>
            ${message.scriptName ? '[' + message.scriptName + ']:' : ''} ${message.text}
        </div>
    </div>
    <div class="right-column">
        <div repeat.for="item of workbench.statusbarService.items.filter(i => i.position === 'right')">
            <au-compose component.bind="item.component"
                        class="statusbar-item"></au-compose>
        </div>

        <i class="quick-tips-icon action-icon"
           click.trigger="showQuickTipsDialog()"
           title="${'ui.quick-tips' | t}"></i>
        <i class="app-deps-check-icon action-icon"
           click.trigger="showAppDepsCheckDialog()"
           title="${'ui.app-dependencies-check' | t}"></i>
        <i class="theme-icon action-icon"
           click.trigger="settingsService.toggleTheme()"
           title="${'ui.toggle-theme' | t}"></i>
        <i class="settings-icon action-icon"
           if.bind="settings.appearance.titlebar.type === 'Native' & oneTime"
           click.trigger="settingsService.openSettingsWindow()"
           title="${shortcutManager.getShortcutByName('Settings').toString()}"></i>
    </div>
</div>

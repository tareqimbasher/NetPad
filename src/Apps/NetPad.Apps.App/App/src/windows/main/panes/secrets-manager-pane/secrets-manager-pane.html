<pane-toolbar>
    <span class="pane-title">Secrets</span>

    <div au-slot="right-end">
        <np-icon name="add" class="icon-button"
           click.trigger="startNewSecret()"
           title="New Secret"></np-icon>
        <np-icon name="refresh" class="icon-button"
           click.trigger="refresh()"
           title="Refresh"></np-icon>
    </div>
</pane-toolbar>

<div class="flex-fill overflow-auto d-flex flex-column">
    <table class="secrets-table" if.bind="secrets.length > 0 || newSecret">
        <thead>
        <tr>
            <th class="label-caps" title="The unique key (name) of the secret.">Key</th>
            <th class="label-caps">Value</th>
            <th class="label-caps" title="When the value was last updated (local time).">Updated</th>
            <th class="secrets-actions-column"></th>
        </tr>
        </thead>
        <tbody>
        <tr repeat.for="secret of secrets">
            <td>
                <span class="secret-key">${secret.key | truncate:100}</span>
                <span class="row-actions">
                    <np-icon name="copy" class="row-action"
                             tooltip="Copy the key to your clipboard."
                             click.trigger="copyKeyToClipboard(secret)"></np-icon>
                </span>
            </td>
            <td>
                <template if.bind="secret.key !== secretInEdit?.key">
                    <span class="secret-value">••••••••</span>
                    <span class="row-actions">
                        <np-icon name="copy" class="row-action"
                                 tooltip="Copy unprotected value to your clipboard."
                                 click.trigger="copyUnprotectedValueToClipboard(secret)"></np-icon>
                        <np-icon name="secrets" class="row-action"
                                 tooltip="Show/edit unprotected value."
                                 click.trigger="selectForEdit(secret)"></np-icon>
                    </span>
                </template>
                <div else class="secret-editor">
                    <textarea class="form-control"
                              rows="3"
                              spellcheck="false"
                              value.bind="secretInEdit.value"></textarea>
                    <span class="row-actions">
                        <np-icon name="check" class="row-action row-action-confirm"
                                 tooltip="Save"
                                 click.trigger="finishEdit()"></np-icon>
                        <np-icon name="close" class="row-action"
                                 tooltip="Cancel"
                                 click.trigger="resetEdits()"></np-icon>
                    </span>
                </div>
            </td>
            <td><span class="secret-updated">${secret.updatedAtUtc | dateTime}</span></td>
            <td class="secrets-actions-column">
                <span class="row-actions">
                    <np-icon name="delete" class="row-action row-action-delete"
                             title="Delete this entry."
                             click.trigger="deleteSecret(secret)"></np-icon>
                </span>
            </td>
        </tr>
        <tr show.bind="newSecret">
            <td>
                <input type="text" class="form-control" placeholder="Secret name" value.bind="newSecret.key"/>
            </td>
            <td>
                <div class="secret-editor">
                    <textarea class="form-control"
                              rows="3"
                              spellcheck="false"
                              placeholder="Secret value"
                              value.bind="newSecret.value"></textarea>
                    <span class="row-actions">
                        <np-icon name="check" class="row-action row-action-confirm"
                                 tooltip="Save"
                                 click.trigger="finishEdit()"></np-icon>
                        <np-icon name="close" class="row-action"
                                 tooltip="Cancel"
                                 click.trigger="resetEdits()"></np-icon>
                    </span>
                </div>
            </td>
            <td></td>
            <td class="secrets-actions-column"></td>
        </tr>
        </tbody>
    </table>
    <div class="flex-fill d-flex align-items-center justify-content-center" else>
        <p class="empty-state"><a class="btn-link" click.trigger="startNewSecret()">Add</a> a new secret to start.</p>
    </div>
</div>

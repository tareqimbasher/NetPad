<div class="syntax-tree" mouseleave.trigger="onMouseLeave()" if.bind="!error">
    <tree-node if.bind="!!current" syntax-node.bind="current" vm.bind="$this"></tree-node>
</div>
<div else class="syntax-tree-error">${error}</div>

<div portal="#codePaneToolbarRightPortal" show.bind="isActive">
    <np-icon name="line-numbers" class="icon-button ${showCharSpans ? 'active' : ''}"
             click.trigger="showCharSpans = !showCharSpans"
             title="Show Line/Char Spans"></np-icon>
    <np-icon name="collapse-all" class="icon-button"
       click.trigger="collapse(current, true)"
       title="Collapse All"></np-icon>
    <np-icon name="expand-all" class="icon-button"
       click.trigger="expand(current, true)"
       title="Expand All"></np-icon>
</div>

<template as-custom-element="tree-node">
    <bindable name="syntaxNode"></bindable>
    <bindable name="vm"></bindable>

    <div class="syntax-row"
         mouseover.trigger="vm.highlightInEditor(syntaxNode) & debounce:100"
         click.trigger="vm.revealInEditor(syntaxNode)"
         dblclick.trigger="vm.selectInEditor(syntaxNode)">

        <np-icon name.bind="syntaxNode.collapsed ? 'chevron-right' : 'chevron-down'" class="syntax-caret"
                 if.bind="syntaxNode.children.length > 0 || syntaxNode.leadingTrivia.length > 0 || syntaxNode.trailingTrivia.length > 0"
                 click.trigger="vm.toggleCollapsed(syntaxNode, $event)"></np-icon>
        <span else class="syntax-caret"></span>

        <np-icon name.bind="syntaxNode.isNode ? 'syntax-node' : 'minus'"
                 class="syntax-mark ${syntaxNode.isNode ? 'syntax-mark-node' : 'syntax-mark-token'}"
                 title="${syntaxNode.isNode ? 'Node' : 'Token'}"></np-icon>

        <span class="syntax-kind ${syntaxNode.isMissing ? 'syntax-kind-missing' : ''}"
              title.bind="syntaxNode.type">${syntaxNode.kind}</span>

        <span class="syntax-row-right">
            <span class="syntax-value" if.bind="syntaxNode.valueText">${syntaxNode.valueText}</span>
            <span class="syntax-span"
                  if.bind="syntaxNode.span && (syntaxNode.isToken || syntaxNode.children.length > 1)"
                  show.bind="vm.showCharSpans">
                [${syntaxNode.span.start.line},${syntaxNode.span.start.character}:${syntaxNode.span.end.line},${syntaxNode.span.end.character}]
            </span>
            <span class="syntax-missing" if.bind="syntaxNode.isMissing">Missing</span>
        </span>
    </div>

    <div class="syntax-nest"
         if.bind="syntaxNode.isNode && syntaxNode.children.length > 0"
         show.bind="!syntaxNode.collapsed">
        <tree-node repeat.for="child of syntaxNode.children"
                   syntax-node.bind="child"
                   vm.bind="vm"></tree-node>
    </div>

    <div class="syntax-nest"
         if.bind="syntaxNode.isToken && (syntaxNode.leadingTrivia.length > 0 || syntaxNode.trailingTrivia.length > 0)"
         show.bind="!syntaxNode.collapsed">
        <syntax-trivia repeat.for="trivia of syntaxNode.leadingTrivia"
                       trivia.bind="trivia"
                       vm.bind="vm">
        </syntax-trivia>

        <div class="syntax-row"
             if.bind="syntaxNode.valueText"
             mouseover.trigger="vm.highlightInEditor(syntaxNode) & debounce:100">
            <span class="syntax-caret"></span>
            <span class="syntax-mark syntax-mark-trivia" title="Value"></span>
            <span class="syntax-value">${syntaxNode.valueText}</span>
        </div>

        <syntax-trivia repeat.for="trivia of syntaxNode.trailingTrivia"
                       trivia.bind="trivia"
                       vm.bind="vm">
        </syntax-trivia>
    </div>
</template>

<template as-custom-element="syntax-trivia">
    <bindable name="trivia"></bindable>
    <bindable name="vm"></bindable>

    <div class="syntax-row" mouseover.trigger="vm.highlightInEditor(trivia) & debounce:100">
        <span class="syntax-caret"></span>
        <span class="syntax-mark syntax-mark-trivia" title="Trivia"></span>
        <span class="syntax-trivia-kind">${trivia.displayValue || trivia.kind}</span>
    </div>
</template>

<template as-custom-element="connection-node">
    <bindable name="connectionViewModel"></bindable>
    <bindable name="vm"></bindable>
    <bindable name="depth"></bindable>

    <div class="tree-row data-connection"
         style="--tree-depth: ${depth}"
         data-connection-id="${connectionViewModel.connection.id}"
         draggable="true"
         dragstart.trigger="vm.connectionDragged($event)"
         title="${connectionViewModel.connection.name} (${connectionViewModel.connection.type})"
         click.trigger="connectionViewModel.toggleExpand()">
        <np-icon name.bind="connectionViewModel.expanded ? 'chevron-down' : 'chevron-right'" class="tree-caret"></np-icon>
        <np-icon name="database" class="tree-glyph glyph-db"></np-icon>
        <span class="tree-name">${connectionViewModel.connection.name}</span>
        <span class="tree-meta">
            <span class="chip"
                  if.bind="connectionViewModel.loadingLabel"
                  title.bind="connectionViewModel.loadingDescription">
                <span class="text-truncate">${connectionViewModel.loadingLabel}</span>
            </span>
            <span class="chip chip-err connection-error"
                  if.bind="!connectionViewModel.loadingLabel && connectionViewModel.error"
                  title.bind="'(Click to copy to clipboard)\n\n' + connectionViewModel.error"
                  click.trigger="vm.copyErrorToClipboard(connectionViewModel, $event)">
                <span class="text-truncate">Failed</span>
            </span>
            <span class="prod-pill"
                  if.bind="connectionViewModel.connection.containsProductionData"
                  title="Contains Production Data!">PROD</span>
        </span>
    </div>

    <template if.bind="connectionViewModel.expanded && connectionViewModel.structure">
        <template repeat.for="schema of connectionViewModel.structure.schemas">
            <div class="tree-row"
                 if.bind="connectionViewModel.hasMultipleSchemas"
                 style="--tree-depth: ${depth + 1}"
                 title="Schema"
                 click.trigger="schema.expanded = !schema.expanded">
                <np-icon name.bind="schema.expanded ? 'chevron-down' : 'chevron-right'" class="tree-caret"></np-icon>
                <np-icon name="db-schema" class="tree-glyph"></np-icon>
                <span class="tree-name">${schema.name || 'default'}</span>
            </div>

            <template if.bind="!connectionViewModel.hasMultipleSchemas || schema.expanded">
                <template repeat.for="table of schema.tables">
                    <div class="tree-row db-table"
                         style="--tree-depth: ${depth + (connectionViewModel.hasMultipleSchemas ? 2 : 1)}"
                         title="Table name: ${table.name}"
                         click.trigger="table.expanded = !table.expanded">
                        <np-icon name.bind="table.expanded ? 'chevron-down' : 'chevron-right'" class="tree-caret"></np-icon>
                        <np-icon name="db-table" class="tree-glyph"></np-icon>
                        <span class="tree-name">${table.displayName}</span>
                    </div>

                    <template if.bind="table.expanded">
                        <div class="tree-row"
                             repeat.for="column of table.columns"
                             style="--tree-depth: ${depth + (connectionViewModel.hasMultipleSchemas ? 3 : 2)}"
                             title="Column Type: ${column.type}">
                            <np-icon name.bind="column.isPrimaryKey ? 'db-primary-key' : (column.isForeignKey ? 'db-foreign-key' : 'db-column')"
                                     class="tree-glyph ${column.isPrimaryKey ? 'glyph-key' : ''}"></np-icon>
                            <span class="tree-name">${column.name}</span>
                            <span class="tree-meta">${column.isPrimaryKey ? 'pk · ' : (column.isForeignKey ? 'fk · ' : '')}${column.clrType}</span>
                        </div>

                        <div class="tree-row"
                             repeat.for="nav of table.navigations"
                             style="--tree-depth: ${depth + (connectionViewModel.hasMultipleSchemas ? 3 : 2)}"
                             title="Navigation property (${nav.clrType})">
                            <np-icon name="db-navigation" class="tree-glyph"></np-icon>
                            <span class="tree-name">${nav.name}</span>
                            <span class="tree-meta">nav</span>
                        </div>

                        <div class="tree-row"
                             repeat.for="index of table.indexes"
                             style="--tree-depth: ${depth + (connectionViewModel.hasMultipleSchemas ? 3 : 2)}"
                             title="Index on: ${index.columns.join(' + ')}\nUnique: ${index.isUnique}">
                            <np-icon name="db-index" class="tree-glyph"></np-icon>
                            <span class="tree-name">${index.name}</span>
                            <span class="tree-meta">${index.isUnique ? 'unique' : 'index'}</span>
                        </div>
                    </template>
                </template>
            </template>
        </template>
    </template>
</template>

<div class="section-header">
    <span class="section-title">Connections</span>
    <span class="section-actions">
        <span class="action-icon composite-action"
              title="Add Server"
              click.trigger="addServer()">
            <np-icon name="add"></np-icon>
            <np-icon name="database-server"></np-icon>
        </span>
        <span class="action-icon composite-action"
              title="Add Database"
              click.trigger="addConnection()">
            <np-icon name="add"></np-icon>
            <np-icon name="database"></np-icon>
        </span>
    </span>
</div>

<div if.bind="!serverViewModels.length && !standaloneConnectionViewModels.length"
     class="flex-grow-1 d-flex align-items-center justify-content-center">
    <p class="empty-state">No connections</p>
</div>

<div else class="tree-list flex-grow-height-restricted overflow-y-auto">
    <let list-vm.bind="$this"></let>

    <div repeat.for="serverVm of serverViewModels"
         data-server-id="${serverVm.server.id}">
        <div class="tree-row database-server"
             style="--tree-depth: 0"
             title="Database server: ${serverVm.server.name}"
             click.trigger="serverVm.toggleExpand()">
            <np-icon name.bind="serverVm.expanded ? 'chevron-down' : 'chevron-right'" class="tree-caret"></np-icon>
            <np-icon name="database-server" class="tree-glyph glyph-db"></np-icon>
            <span class="tree-name">${serverVm.server.name}</span>
            <span class="tree-meta">
                <span title="${serverVm.connections.length} connection(s)">${serverVm.connections.length}</span>
                <span class="prod-pill"
                      if.bind="serverVm.server.containsProductionData"
                      title="Contains Production Data!">PROD</span>
            </span>
        </div>

        <template if.bind="serverVm.expanded">
            <connection-node repeat.for="connectionViewModel of serverVm.connections"
                             connection-view-model.bind="connectionViewModel"
                             vm.bind="listVm"
                             depth.bind="1"
                             data-connection-id="${connectionViewModel.connection.id}"></connection-node>
        </template>
    </div>

    <connection-node repeat.for="connectionViewModel of standaloneConnectionViewModels"
                     connection-view-model.bind="connectionViewModel"
                     vm.bind="listVm"
                     depth.bind="0"
                     data-connection-id="${connectionViewModel.connection.id}"></connection-node>
</div>

<context-menu options.bind="dataConnectionContextOptions"></context-menu>
<context-menu options.bind="serverContextOptions"></context-menu>
<context-menu options.bind="tableContextOptions"></context-menu>

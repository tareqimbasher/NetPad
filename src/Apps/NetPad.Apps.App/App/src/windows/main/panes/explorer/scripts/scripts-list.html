<template as-custom-element="script-folder">
    <bindable name="folder"></bindable>
    <bindable name="vm"></bindable>
    <bindable name="depth"></bindable>

    <div class="tree-row script-folder"
         style="--tree-depth: ${depth}"
         data-folder-path="${folder.path}"
         click.trigger="folder.expanded = !folder.expanded">
        <np-icon name.bind="folder.expanded ? 'chevron-down' : 'chevron-right'" class="tree-caret"></np-icon>
        <np-icon name.bind="folder.expanded ? 'folder-open' : 'folder'" class="tree-glyph glyph-folder"></np-icon>
        <span class="tree-name">${folder.name}</span>
        <span class="tree-meta">
            <np-icon name="folder-open" class="row-action"
               title="Open in File Manager"
               click.trigger="vm.openScriptsFolder(folder, $event)"></np-icon>
            <span title="${folder.containingScriptCount} scripts">${folder.containingScriptCount}</span>
        </span>
    </div>

    <template if.bind="folder.expanded">
        <script-folder repeat.for="childFolder of folder.folders | sort:'name':'ordinalIgnoreCase'"
                       folder.bind="childFolder"
                       vm.bind="vm"
                       depth.bind="depth + 1"></script-folder>

        <div class="tree-row script ${script.cssClasses}"
             repeat.for="script of folder.scripts | sort:'name':'ordinalIgnoreCase'"
             style="--tree-depth: ${depth + 1}"
             data-script-id="${script.id}"
             title.bind="script.path"
             click.trigger="vm.session.openByPath(script.path)">
            <np-icon name="script" class="tree-glyph glyph-script"></np-icon>
            <span class="tree-name">${script.name}</span>
            <span class="tree-meta">
                <span class="state-dot dirty"
                      if.bind="script.isDirty"
                      title="Modified (unsaved changes)"></span>
                <span class="state-dot ${script.statusIndicator}"
                      if.bind="script.showStatusDot"
                      title.bind="script.statusTitle"></span>
            </span>
        </div>
    </template>
</template>

<div class="section-header">
    <span class="section-title">Scripts</span>
    <span class="section-actions">
        <np-icon name="expand-all" class="action-icon"
           title="Expand All"
           click.trigger="expandAllFolders(rootScriptFolder)"></np-icon>
        <np-icon name="collapse-all" class="action-icon"
           title="Collapse All"
           click.trigger="collapseAllFolders(rootScriptFolder)"></np-icon>
    </span>
</div>

<div class="tree-list flex-grow-height-restricted overflow-y-auto">
    <script-folder folder.bind="rootScriptFolder" vm.bind="$this" depth.bind="0"></script-folder>
</div>

<context-menu options.bind="scriptContextMenuOptions"></context-menu>
<context-menu options.bind="folderContextMenuOptions"></context-menu>

<pane-toolbar>
    <span class="pane-title">MemCache</span>
    <div au-slot="right">
        <np-icon name="clear-output" class="icon-button"
           click.trigger="clearCache()"
           title="Clear Cache"></np-icon>
    </div>
</pane-toolbar>
<div if.bind="session.active.memCacheItems.length"
     class="flex-grow-height-restricted min-w-0 d-flex flex-column">
    <div class="search-row">
        <input type="text"
               class="form-control"
               placeholder="Search..."
               value.bind="searchTerm"
               spellcheck="false"/>
        <np-icon name="case-sensitive" class="action-icon ${caseSensitiveSearch ? 'active' : ''}"
           click.trigger="caseSensitiveSearch = !caseSensitiveSearch"
           title="Match Case"></np-icon>
    </div>

    <div class="flat-list flex-grow-height-restricted overflow-y-auto">
        <div repeat.for="item of items"
             class="flat-list-row"
             title="Key: ${item.key.substring(0, 1000)}\nIs value initialized: ${item.valueInitialized}\nIs factory: ${item.isFactory}"
             click.trigger="select(item)">
            <span class="row-ordinal">${$index + 1}</span>
            <span class="row-value text-truncate">${item.key.substring(0, 200)}</span>
            <span class="row-type text-truncate"
                  title.bind="item.valueType.substring(0, 1000)">
                ${item.valueType.substring(0, 200)}
            </span>
            <np-icon name="delete" class="row-action"
               title="Delete"
               click.trigger="removeKey(item.key, $event)"></np-icon>
        </div>
    </div>
</div>
<div else class="flex-fill d-flex align-items-center justify-content-center">
    <p class="empty-state">No cached items.</p>
</div>

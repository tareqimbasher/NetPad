<template class="excel-export-dialog dialog-frame dialog-m">
    <div class="dialog-bar">
        <span class="dialog-title">Export to Excel</span>
    </div>

    <div class="dialog-body">
        <div>
            <span class="group-label">Options</span>
            <div class="setting-group">
                <label class="setting-row">
                    <div class="setting-info">
                        <div class="setting-title">Export code</div>
                        <div class="setting-description">Your script's code goes to a worksheet of its own.</div>
                    </div>
                    <div class="setting-control">
                        <input type="checkbox" class="form-check-input" checked.bind="options.includeCode">
                    </div>
                </label>

                <label class="setting-row">
                    <div class="setting-info">
                        <div class="setting-title">Sheet per output item</div>
                        <div class="setting-description">Uncheck to export all output to a single worksheet.</div>
                    </div>
                    <div class="setting-control">
                        <input type="checkbox" class="form-check-input" checked.bind="options.sheetPerOutputItem">
                    </div>
                </label>

                <label class="setting-row">
                    <div class="setting-info">
                        <div class="setting-title">Freeze headers</div>
                        <div class="setting-description">Keep table header rows visible while scrolling.</div>
                    </div>
                    <div class="setting-control">
                        <input type="checkbox" class="form-check-input" checked.bind="options.freezeHeaders">
                    </div>
                </label>
            </div>
        </div>

        <div>
            <button type="button" class="group-label"
                    click.trigger="showAdvancedOptions = !showAdvancedOptions"
                    aria-expanded.bind="showAdvancedOptions">
                <np-icon name.bind="showAdvancedOptions ? 'chevron-down' : 'chevron-right'"></np-icon>
                Advanced
            </button>

            <div class="setting-group" if.bind="showAdvancedOptions">
                <label class="setting-row">
                    <div class="setting-info">
                        <div class="setting-title">Export non-tabular data</div>
                        <div class="setting-description">Uncheck to export tables only.</div>
                    </div>
                    <div class="setting-control">
                        <input type="checkbox" class="form-check-input" checked.bind="options.includeNonTabularData">
                    </div>
                </label>

                <div class="setting-row">
                    <div class="setting-info">
                        <div class="setting-title">Header background</div>
                    </div>
                    <div class="setting-control">
                        <label class="field-check" repeat.for="option of headerBackgroundOptions.options">
                            <input type="radio"
                                   class="form-check-input"
                                   name="headerBackground"
                                   model.bind="option"
                                   checked.bind="headerBackgroundOptions.selected">
                            <span class="${headerBackgroundOptions.selected === option ? '' : 'text-muted'}">${option.text}</span>
                            <input if.bind="option.isSelector"
                                   type="color"
                                   class="color-swatch"
                                   value.bind="option.color"
                                   disabled.bind="headerBackgroundOptions.selected !== option">
                        </label>
                    </div>
                </div>

                <div class="setting-row">
                    <div class="setting-info">
                        <div class="setting-title">Header foreground</div>
                    </div>
                    <div class="setting-control">
                        <label class="field-check" repeat.for="option of headerForegroundOptions.options">
                            <input type="radio"
                                   class="form-check-input"
                                   name="headerForeground"
                                   model.bind="option"
                                   checked.bind="headerForegroundOptions.selected">
                            <span class="${headerForegroundOptions.selected === option ? '' : 'text-muted'}">${option.text}</span>
                            <input if.bind="option.isSelector"
                                   type="color"
                                   class="color-swatch"
                                   value.bind="option.color"
                                   disabled.bind="headerForegroundOptions.selected !== option">
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="window-footer">
        <span class="flex-1"></span>
        <button class="btn" click.trigger="cancel()">Cancel</button>
        <button class="btn btn-primary" click.trigger="export()">Export</button>
    </div>
</template>

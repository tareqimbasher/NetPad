<template class="scaffold-to-project-dialog dialog-frame dialog-m">
    <div class="dialog-bar">
        <span class="dialog-title">Scaffold to a C# Project</span>
    </div>

    <div class="dialog-body">
        <div class="field">
            <span class="field-label">Connection</span>
            <data-connection-name connection.bind="connection"></data-connection-name>
        </div>

        <div class="field">
            <span class="field-label">Project directory</span>
            <div class="field-row">
                <input class="form-control font-monospace"
                       type="text"
                       placeholder="Directory to create the project in"
                       spellcheck="false"
                       value.bind="projectDirectory"
                       disabled.bind="isWorking">
                <button class="btn" click.trigger="showDirPicker()" disabled.bind="isWorking">Browse…</button>
            </div>
            <span class="field-note">The project is created directly inside this folder.</span>
        </div>

        <div class="field field-sdk">
            <span class="field-label">.NET SDK version</span>
            <select class="form-select" value.bind="selectedDotNetFrameworkVersion" disabled.bind="isWorking">
                <option value.bind="framework" repeat.for="framework of availableFrameworkVersions">
                    .NET ${framework.replace('DotNet', '')}
                </option>
            </select>
        </div>

        <div class="field-error"
             if.bind="error"
             title.bind="'(Click to copy to clipboard)\n\n' + error"
             click.trigger="copyErrorToClipboard()">
            An error occurred creating the project. Hover for details.
        </div>
    </div>

    <div class="window-footer">
        <span class="flex-1"></span>
        <button class="btn" click.trigger="cancel()" disabled.bind="isWorking">Cancel</button>
        <button class="btn btn-primary" click.trigger="scaffold()" disabled.bind="!projectDirectory || isWorking">
            ${isWorking ? 'Scaffolding…' : 'Create'}
        </button>
    </div>
</template>

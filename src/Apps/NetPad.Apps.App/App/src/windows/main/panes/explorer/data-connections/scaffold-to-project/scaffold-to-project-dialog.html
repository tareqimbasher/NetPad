<template class="scaffold-to-project-dialog">
    <h4 class="main-header">${'ui.scaffold-connection-to-a-c-project' | t}<i class="code-icon float-end"></i>
    </h4>

    <div class="mb-5">
        <div class="mb-2 fw-bold">${'ui.connection' | t}</div>
        <data-connection-name connection.bind="connection"></data-connection-name>
    </div>

    <div class="mb-5"
         title="${'ui.the-directory-to-create-the-project-in-no-new-fold' | t}">
        <div class="fw-bold">${'ui.project-directory' | t}</div>
        <div class="mt-2 d-flex gap-3">
            <input class="form-control"
                   type="text"
                   placeholder="${'ui.directory-to-create-the-project-in' | t}"
                   spellcheck="false"
                   value.bind="projectDirectory"
                   disabled.bind="isWorking">
            <button class="btn btn-secondary" click.trigger="showDirPicker()" disabled.bind="isWorking">${'ui.browse' | t}</button>
        </div>
    </div>

    <div class="mb-5" title="${'ui.the-project-net-sdk-version-to-use' | t}">
        <div class="fw-bold">${'ui.net-sdk-version' | t}</div>
        <div class="mt-2 d-flex gap-3">
            <select class="form-select" value.bind="selectedDotNetFrameworkVersion" disabled.bind="isWorking">
                <option value.bind="framework" repeat.for="framework of availableFrameworkVersions">
                    .NET ${framework.replace('DotNet', '')}
                </option>
            </select>
        </div>
    </div>

    <div class="mb-5 text-danger"
         style="cursor: default"
         if.bind="error"
         title.bind="'(Click to copy to clipboard)\n\n' + error"
         click.trigger="copyErrorToClipboard(connectionViewModel)">${'ui.an-error-occurred-creating-the-project-hover-for-d' | t}</div>

    <div class="bottom-bar">
        <div class="buttons">
            <button class="btn btn-secondary" click.trigger="cancel()" disabled.bind="isWorking">${'ui.cancel' | t}</button>
            <button class="btn btn-primary" click.trigger="scaffold()" disabled.bind="!projectDirectory || isWorking">
                <span if.bind="!isWorking">${'ui.create' | t}</span>
                <span else class="d-flex">${'ui.scaffolding-2' | t}<spinner style="height: 20px; width: 20px"></spinner>
                </span>
            </button>
        </div>
    </div>
</template>

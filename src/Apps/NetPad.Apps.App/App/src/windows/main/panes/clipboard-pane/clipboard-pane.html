<pane-toolbar>
    <span class="pane-title">Clipboard</span>
    <div au-slot="right">
        <np-icon name="clear-output" class="icon-button"
           click.trigger="history.clear()"
           title="Clear History"></np-icon>
    </div>
</pane-toolbar>
<div if.bind="history.size" class="flex-grow-height-restricted min-w-0 d-flex flex-column">
    <div class="search-field pane-search-field">
        <np-icon name="search"></np-icon>
        <input type="text"
               placeholder="Search…"
               value.bind="searchTerm"
               spellcheck="false"/>
        <np-icon name="case-sensitive" class="action-icon ${caseSensitiveSearch ? 'active' : ''}"
                 click.trigger="caseSensitiveSearch = !caseSensitiveSearch"
                 title="Match Case"></np-icon>
    </div>

    <div class="flat-list flex-grow-height-restricted overflow-y-auto">
        <div repeat.for="entry of viewableHistory"
             class="flat-list-row ${selected === entry ? 'selected' : ''}"
             click.trigger="select(entry, $event)">
            <span class="row-ordinal">${$index + 1}</span>
            <span class="row-value text-truncate" title.bind="entry.substring(0, 1000)">
                ${entry.substring(0, 200)}
            </span>
            <np-icon name="check-circle" class="row-selected-marker" if.bind="selected === entry"></np-icon>
            <np-icon name="delete" class="row-action" else
               title="Delete"
               click.trigger="removeEntry(entry)"></np-icon>
        </div>
    </div>
</div>
<div else class="flex-fill d-flex align-items-center justify-content-center">
    <p class="empty-state">No History</p>
</div>

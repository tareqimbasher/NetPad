<p class="fw-bold">${'ui.these-options-control-the-scaffolding-process' | t}</p>

<div class="input-row"
     title="${'ui.don-t-use-the-pluralizer' | t}">
    <div class="label-column">
        <label class="col-form-label"
               for="chkNoPluralize">${'ui.no-pluralize' | t}</label>
    </div>
    <div class="input-column">
        <div class="form-check">
            <input id="chkNoPluralize" class="form-check-input"
                   type="checkbox"
                   checked.bind="connection.scaffoldOptions.noPluralize">
        </div>
    </div>
</div>

<div class="input-row"
     title="${'ui.use-table-view-sequence-and-column-names-exactly-a' | t}">
    <div class="label-column">
        <label class="col-form-label"
               for="chkUseDbNames">${'ui.use-database-names' | t}</label>
    </div>
    <div class="input-column">
        <div class="form-check">
            <input id="chkUseDbNames" class="form-check-input"
                   type="checkbox"
                   checked.bind="connection.scaffoldOptions.useDatabaseNames">
        </div>
    </div>
</div>

<div class="input-row"
     title="${'ui.generate-a-pre-compiled-model-that-can-improve-ef-' | t}">
    <div class="label-column">
        <label class="col-form-label"
               for="chkOptimizeDbContext">${'ui.use-compiled-model' | t}</label>
    </div>
    <div class="input-column">
        <div class="form-check">
            <input id="chkOptimizeDbContext" class="form-check-input"
                   type="checkbox"
                   checked.bind="connection.scaffoldOptions.optimizeDbContext">
        </div>
        <a href="https://learn.microsoft.com/en-us/ef/core/performance/advanced-performance-topics#compiled-models"
           external-link>${'ui.learn-more' | t}</a>
    </div>
</div>

<hr class="mb-4"/>

<div class="row">
    <div class="col">
        <b>${'ui.schemas' | t}</b>
        <p>${'ui.the-schemas-of-tables-and-views-to-generate-entity' | t}<i class="info-icon text-info"
               title="${'ui.if-no-schemas-are-defined-all-schemas-are-included' | t}"></i>
        </p>
        <textarea value.bind="schemas"
                  class="form-control"
                  rows="8"
                  spellcheck="false"
                  placeholder="${'ui.schema1-schema2-schema3' | t}"></textarea>
    </div>
    <div class="col">
        <b>${'ui.tables' | t}</b>
        <p>${'ui.the-tables-and-views-to-generate-entity-types-for' | t}<i class="info-icon text-info"
               title="${'ui.tables-or-views-in-a-specific-schema-can-be-includ' | t}"></i>
        </p>
        <textarea value.bind="tables"
                  class="form-control"
                  rows="8"
                  spellcheck="false"
                  placeholder="${'ui.table1-table2-table3' | t}"></textarea>
    </div>
</div>

<div class="input-row">
    <div class="label-column">
        <label class="col-form-label">${'ui.host' | t}</label>
    </div>
    <div class="input-column d-flex">
        <input type="text" class="form-control" value.bind="connection.host" spellcheck="false"/>
        <label class="col-form-label text-nowrap ms-5 me-3">${'ui.port' | t}</label>
        <input type="number" class="form-control" value.bind="connection.port"
               style="max-width: 7rem"/>
    </div>
</div>

<div class="field field-half">
    <span class="field-label">Host</span>
    <input type="text"
           class="form-control mono-value ${hostError ? 'is-invalid' : ''}"
           value.bind="connection.host"
           spellcheck="false"
           blur.trigger="touched.host = true"/>
    <span class="field-error" if.bind="hostError">${hostError}</span>
</div>

<div class="field field-narrow">
    <span class="field-label">Port</span>
    <input type="text"
           class="form-control mono-value"
           inputmode="numeric"
           value.bind="connection.port"
           placeholder.bind="defaultPort"
           spellcheck="false"/>
</div>

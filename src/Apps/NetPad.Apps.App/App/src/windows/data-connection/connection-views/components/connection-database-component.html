<div class="field field-full">
    <span class="field-label">${isFileBased ? 'Database file' : 'Database'}</span>

    <div class="field-row" if.bind="isFileBased">
        <input type="text"
               class="form-control mono-value ${databaseError ? 'is-invalid' : ''}"
               value.bind="connection.databaseName"
               placeholder="Full path to database file…"
               spellcheck="false"
               blur.trigger="touched.databaseName = true"/>
        <button class="btn"
                if.bind="options.allowSelectDatabaseFile"
                click.trigger="browseDatabaseFile()">
            Browse…
        </button>
    </div>

    <np-value-select else
                     class="mono database-select ${databaseError ? 'is-invalid' : ''}"
                     label="Database"
                     icon="database"
                     editable.bind="true"
                     placeholder="Type a name, or pick one"
                     empty-text="No databases loaded"
                     loading-text="loading databases…"
                     loading.bind="loadingDatabases"
                     hint.bind="databasesHint"
                     options.bind="databaseOptions"
                     value.two-way="connection.databaseName"
                     focusout.trigger="touched.databaseName = true"></np-value-select>

    <span class="field-error" if.bind="databaseError">${databaseError}</span>
</div>

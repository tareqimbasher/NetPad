<au-compose class="composed-fields"
            repeat.for="component of credentialComponents"
            component.bind="component"></au-compose>

<label class="field-full field-check" if.bind="isMssql" title="Select to always trust the server certificate.">
    <input type="checkbox" class="form-check-input" checked.bind="trustServerCertificate">
    Trust server certificate
</label>

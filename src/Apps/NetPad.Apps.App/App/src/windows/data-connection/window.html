<template>
    <import from="./scaffolding-options/scaffolding-options"></import>

    <div class="window connection-window">
        <div class="connection-body">
            <div class="form-grid">
                <div class="field field-half">
                    <span class="field-label">Provider</span>
                    <np-value-select class="provider-select"
                                     label="Provider"
                                     placeholder="Choose a provider…"
                                     options.bind="providerOptions"
                                     value.two-way="providerType"
                                     auto-open.bind="autoOpenProviderMenu"
                                     disabled.bind="testingConnectionStatus === 'testing'"></np-value-select>
                </div>

                <div class="field field-half">
                    <span class="field-label">Environment</span>
                    <div class="segmented-control environment-control">
                        <button type="button"
                                class="${!containsProductionData ? 'selected' : ''}"
                                click.trigger="containsProductionData = false">
                            Development
                        </button>
                        <button type="button"
                                class="warn ${containsProductionData ? 'selected' : ''}"
                                click.trigger="containsProductionData = true"
                                title="Be extra careful, this connection contains production data!">
                            Production
                        </button>
                    </div>
                </div>

                <div class="field field-full">
                    <span class="field-label">Name</span>
                    <input type="text"
                           class="form-control ${nameError ? 'is-invalid' : ''}"
                           placeholder="Connection name"
                           spellcheck="false"
                           value.bind="name"
                           blur.trigger="nameTouched = true">
                    <span class="field-error" if.bind="nameError">${nameError}</span>
                </div>

                <au-compose class="composed-fields" component.bind="connectionView"></au-compose>
            </div>

            <div class="form-elastic" if.bind="connectionView.elasticComponent">
                <au-compose class="composed-fields" component.bind="connectionView.elasticComponent"></au-compose>
            </div>

            <div class="form-grid" if.bind="connectionView">
                <div class="field field-full">
                    <span class="field-label">
                        Connection string
                        <template if.bind="!showConnectionStringAugment">
                            <span class="field-label-divider">·</span>
                            <a class="text-link" click.trigger="showConnectionStringAugment = true">customize</a>
                        </template>
                        <template if.bind="showConnectionStringAugment && canHideConnectionStringAugment">
                            <span class="field-label-divider">·</span>
                            <a class="text-link" click.trigger="showConnectionStringAugment = false">hide</a>
                        </template>
                    </span>
                    <textarea class="form-control connection-string"
                              placeholder="Auto-generated…"
                              spellcheck="false"
                              readonly>${connectionString}</textarea>
                </div>

                <div class="field field-full" if.bind="showConnectionStringAugment">
                    <span class="field-label">Augment</span>
                    <input type="text"
                           class="form-control mono-value"
                           placeholder="ex: Timeout=300;Pooling=false"
                           spellcheck="false"
                           value.bind="connectionStringAugment">
                    <span class="field-note">Key/values merged over the generated string.</span>
                </div>

                <div class="field-full connection-test">
                    <button class="btn"
                            click.trigger="testConnection()"
                            disabled.bind="testingConnectionStatus === 'testing' || !isConnectionValid">
                        Test connection
                    </button>

                    <span class="chip" if.bind="testingConnectionStatus === 'testing'">
                        <spinner class="chip-spinner"></spinner>
                        testing…
                    </span>
                    <span class="chip chip-ok" if.bind="testingConnectionStatus === 'success'">
                        <span class="state-dot success"></span>
                        ${testSuccessText}
                    </span>
                    <span class="chip chip-err" if.bind="testingConnectionStatus === 'fail'">
                        <span class="state-dot error"></span>
                        failed · ${testDurationText}
                    </span>
                </div>

                <div class="field-full connection-test-error"
                     if.bind="testingConnectionStatus === 'fail' && testingConnectionFailureMessage"
                     title.bind="testingConnectionFailureMessage">
                    ${testingConnectionFailureMessage}
                </div>
            </div>

            <div class="connection-form-placeholder" if.bind="!connectionView">
                Choose a provider to configure the connection
            </div>
        </div>

        <div class="window-footer">
            <button class="btn btn-link"
                    if.bind="scaffoldingOptionsConnection && !isScaffoldingManagedByServer"
                    click.trigger="showScaffoldingOptions = true">
                Scaffolding options…
            </button>
            <span class="scaffolding-managed-note" if.bind="isScaffoldingManagedByServer">
                Scaffolding is managed by
                <span if.bind="managingServerName">server <span class="server-name">${managingServerName}</span></span>
                <span else>this connection's server</span>
            </span>
            <span class="flex-1"></span>
            <button class="btn" click.trigger="cancel()">Cancel</button>
            <button class="btn btn-primary" click.trigger="save()" disabled.bind="!isConnectionValid">
                ${saveButtonText}
            </button>
        </div>

        <scaffolding-options if.bind="showScaffoldingOptions"
                             connection.bind="scaffoldingOptionsConnection"
                             done.bind="() => showScaffoldingOptions = false"></scaffolding-options>
    </div>
</template>

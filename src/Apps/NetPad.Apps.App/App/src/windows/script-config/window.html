<template>
    <import from="./namespace-management/namespace-management"></import>
    <import from="./reference-management/reference-management"></import>
    <import from="./package-management/package-management"></import>

    <div class="window">
        <div class="rail-window">
            <div class="rail-window-rail">
                <div class="rail-nav-item ${tab === configStore.selectedTab ? 'selected' : ''}"
                     repeat.for="tab of configStore.tabs"
                     click.trigger="configStore.selectedTab = tab">
                    <np-icon name.bind="tab.icon"></np-icon>
                    ${tab.text}
                    <span class="rail-nav-count">${configStore[tab.countProp]}</span>
                </div>
            </div>

            <div class="rail-window-content">
                <reference-management show.bind="configStore.selectedTab.route === 'references'"></reference-management>
                <package-management show.bind="configStore.selectedTab.route === 'packages'"></package-management>
                <namespace-management show.bind="configStore.selectedTab.route === 'namespaces'"
                                      class="rail-window-page-fill"></namespace-management>
            </div>
        </div>

        <div class="rail-window-footer">
            <label class="footer-check">
                <input type="checkbox" class="form-check-input" checked.bind="configStore.useAspNet">
                Reference ASP.NET
            </label>
            <div class="footer-context-actions" id="view-footer-actions"></div>
            <span class="flex-1"></span>
            <button class="btn" click.trigger="cancel()">Cancel</button>
            <button class="btn btn-primary" click.trigger="save()">Save</button>
        </div>
    </div>
</template>

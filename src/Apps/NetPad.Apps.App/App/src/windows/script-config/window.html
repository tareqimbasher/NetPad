<template>
    <import from="./namespace-management/namespace-management"></import>
    <import from="./reference-management/reference-management"></import>
    <import from="./package-management/package-management"></import>

    <div class="window" if.bind="unavailable">
        <div class="window-notice">
            <np-icon name="script-unknown"></np-icon>
            <div class="window-notice-title">Script isn't open</div>
            <div class="window-notice-body">
                This script is no longer open in NetPad. Close this window, then open properties again from the
                script's tab or the explorer.
            </div>
            <button class="btn" click.trigger="cancel()">Close</button>
        </div>
    </div>

    <div class="window" else>
        <div class="rail-window">
            <div class="rail-window-rail">
                <div class="rail-nav-item ${tab === configStore.selectedPage ? 'selected' : ''}"
                     repeat.for="tab of configStore.pages"
                     click.trigger="configStore.selectedPage = tab">
                    <np-icon name.bind="tab.icon"></np-icon>
                    ${tab.text}
                    <span class="rail-nav-count">${configStore[tab.countProp]}</span>
                </div>
            </div>

            <div class="rail-window-content">
                <reference-management show.bind="configStore.selectedPage.route === 'references'"></reference-management>
                <package-management show.bind="configStore.selectedPage.route === 'packages'"></package-management>
                <namespace-management show.bind="configStore.selectedPage.route === 'namespaces'"
                                      class="rail-window-page-fill"></namespace-management>
            </div>
        </div>

        <div class="window-footer">
            <label class="footer-check">
                <input type="checkbox" class="form-check-input" checked.bind="configStore.useAspNet">
                Reference ASP.NET
            </label>
            <div class="footer-context-actions" id="view-footer-actions"></div>
            <span class="flex-1"></span>
            <button class="btn" click.trigger="cancel()">Cancel</button>
            <button class="btn btn-primary" click.trigger="save()">Save</button>
        </div>

        <command-palette></command-palette>
    </div>
</template>

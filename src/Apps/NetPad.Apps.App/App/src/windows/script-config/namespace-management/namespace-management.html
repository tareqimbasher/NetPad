<p class="namespace-help">
    List each namespace (using directive) on its own line. Omit the
    <code>using</code> keyword and the trailing semicolon (<code>;</code>).
</p>

<textarea class="namespace-textarea"
          value.bind="namespaces & updateTrigger:'blur'"
          placeholder="System.Linq&#10;System.Text"
          spellcheck="false"></textarea>

<div class="namespace-error" show.bind="!!error">${error}</div>

<div class="reference-view">
    <div class="reference-empty" if.bind="!references.length">
        <p class="empty-state">
            No references yet.<br>
            <span shells="!browser">
                <a class="text-link" click.trigger="browseAssemblies()">Browse</a> for an assembly, or
                <a class="text-link" click.trigger="configStore.selectedTab = configStore.tabs[1]">add a NuGet package</a>.
            </span>
            <span shells="browser">
                <a class="text-link" click.trigger="configStore.selectedTab = configStore.tabs[1]">Add a NuGet package</a>.
            </span>
        </p>
    </div>

    <div class="reference-grid" else>
        <div class="reference-list-pane">
            <div class="reference-head">
                <span class="label-caps">Name</span>
                <span class="label-caps">Source</span>
                <span></span>
            </div>
            <div class="reference-rows">
                <div class="reference-row ${selectedReference === reference ? 'selected' : ''}"
                     repeat.for="reference of references"
                     click.trigger="selectReference(reference)">
                    <span class="ref-name">
                        <span class="text-truncate">${reference.title}</span>
                        <span class="ref-ver" if.bind="reference.version">${reference.version}</span>
                    </span>
                    <span class="ref-source">
                        <span class="chip ref-nuget-chip" if.bind="reference.version">NuGet</span>
                        <span class="ref-path" else>${reference.assemblyPath || reference.title}</span>
                    </span>
                    <np-icon name="close"
                             class="ref-remove"
                             title="Remove reference"
                             click.trigger="removeReference(reference, $event)"></np-icon>
                </div>
            </div>
        </div>

        <div class="reference-detail">
            <div class="reference-detail-empty" if.bind="!selectedReference">
                Select a reference to choose its namespaces.
            </div>
            <template else>
                <span class="label-caps detail-label">Namespaces · ${selectedReference.title}</span>
                <div class="namespace-picker">
                    <label repeat.for="namespace of namespaces">
                        <input type="checkbox" class="form-check-input" checked.bind="namespace.selected">
                        <span class="text-break">${namespace.name}</span>
                    </label>
                </div>
                <div class="namespace-hint">Checked namespaces join the script's usings.</div>
            </template>
        </div>
    </div>
</div>

<div portal="#view-footer-actions"
     if.bind="configStore.selectedTab.route === 'references'"
     shells="!browser">
    <button class="btn btn-link" click.trigger="browseAssemblies()">Browse assemblies…</button>
</div>

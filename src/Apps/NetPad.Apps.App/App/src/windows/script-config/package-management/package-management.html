<template>
    <import from="./package-detail-panel/package-detail-panel"></import>

    <div class="package-browser">
        <div class="package-list-pane" ref="listPaneEl">
            <div class="browser-toolbar">
                <div class="search-field browser-search">
                    <np-icon name="search"></np-icon>
                    <input if.bind="source === 'feeds'"
                           type="text"
                           value.bind="search.term & debounce:400"
                           placeholder="Search packages…"
                           spellcheck="false">
                    <input else
                           type="text"
                           value.bind="cache.filter"
                           placeholder="Filter cache…"
                           spellcheck="false">
                </div>

                <div class="segmented-control">
                    <button class="${source === 'feeds' ? 'selected' : ''}" click.trigger="setSource('feeds')">
                        Feeds
                    </button>
                    <button class="${source === 'cache' ? 'selected' : ''}" click.trigger="setSource('cache')">
                        local cache <span class="seg-count">${cacheCount}</span>
                    </button>
                </div>

                <label class="toolbar-toggle" if.bind="source === 'feeds'"
                       title="Include pre-release versions in results">
                    <input type="checkbox" class="toggle-switch" checked.bind="search.prerelease">
                    Pre-release
                </label>
                <label class="toolbar-toggle" else
                       title="Show packages that were installed as dependencies of other packages">
                    <input type="checkbox" class="toggle-switch" checked.bind="cache.showDependencies">
                    Dependencies
                </label>
            </div>

            <div class="package-list" scroll.trigger="onListScroll($event)">
                <div class="pkg-row ${selection && selection.package === row ? 'selected' : ''}"
                     repeat.for="row of visibleRows"
                     click.trigger="selectRow(row)">
                    <div class="pkg-tile">
                        <img if.bind="row.iconUrl" src.bind="row.iconUrl" loading="lazy" alt=""
                             error.trigger="row.onIconError()">
                        <span else>${row.initials}</span>
                    </div>
                    <div class="pkg-info">
                        <div class="pkg-name">
                            <span class="text-truncate">${row.title}</span>
                            <span class="chip chip-accent pkg-chip" if.bind="row.showReferencedChip">referenced</span>
                            <span class="chip pkg-chip" if.bind="row.showDependencyChip">dependency</span>
                        </div>
                        <div class="pkg-desc">${row.description}</div>
                    </div>
                    <span class="pkg-ver">${row.version}</span>
                    <span class="pkg-ver pkg-ver-up"
                          if.bind="row.hasUpdate"
                          title="A newer version is available">
                        <np-icon name="chevron-up"></np-icon>${row.latestAvailableVersion}
                    </span>
                </div>

                <template if.bind="source === 'feeds'">
                    <div class="pkg-list-note" if.bind="search.loading">Loading…</div>
                    <div class="pkg-list-note"
                         if.bind="search.error || (!search.loading && !search.results.length && search.unavailableSources.length)">
                        Could not load results. Check your internet connection.
                    </div>
                    <div class="pkg-list-note"
                         if.bind="!search.loading && !search.error && !search.results.length && !search.unavailableSources.length">
                        No packages found.
                    </div>
                </template>
                <template else>
                    <div class="pkg-list-note" if.bind="cache.loading && !cache.packages.length">Loading…</div>
                    <div class="pkg-list-note" if.bind="!cache.loading && !cache.visible.length">
                        No cached packages.
                    </div>
                </template>
            </div>

            <div class="package-list-status" if.bind="source === 'feeds'">
                ${search.results.length} ${search.results.length === 1 ? 'result' : 'results'}<span
                    if.bind="search.hasMore"> · scroll for more</span><span
                    class="feed-unavailable"
                    if.bind="search.unavailableSources.length"
                    title.bind="search.unavailableSources.join(', ')">
                    · ${search.unavailableSources.length}
                    ${search.unavailableSources.length === 1 ? 'feed' : 'feeds'} unavailable</span>
            </div>
            <div class="package-list-status" else>
                ${cache.visible.length} cached ${cache.visible.length === 1 ? 'version' : 'versions'}
                · ${cache.visibleIdCount} ${cache.visibleIdCount === 1 ? 'package' : 'packages'}
            </div>
        </div>

        <package-detail-panel ref="detailPaneEl"
                              selection.bind="selection"
                              cache.bind="cache"
                              include-prerelease.bind="search.prerelease"></package-detail-panel>
    </div>

    <div portal="#view-footer-actions" if.bind="configStore.selectedTab.route === 'packages'">
        <button class="btn btn-link" click.trigger="openCacheDirectory()">Open cache folder</button>
        <button class="btn btn-outline-danger" click.trigger="purgeCache()">Purge cache…</button>
    </div>
</template>

<template show.bind="show">
    <div class="search-field">
        <np-icon name="search"></np-icon>
        <input ref="txtSearch" type="text" placeholder="Find" spellcheck="false" value.bind="searchText & debounce:200"/>
        <span class="found-count ${!current.searchResults.matches.length ? 'none-found' : ''}" show.bind="!!searchText">
            ${!current.searchResults.matches.length ? 'No results' : (current.searchResults.currentResultNumber + ' of ' + current.searchResults.matches.length)}
        </span>
    </div>

    <np-icon name="arrow-up" class="action-icon"
       click.trigger="goToPreviousResult()"
       title="Previous Match (Shift + Enter)"></np-icon>

    <np-icon name="arrow-down" class="action-icon"
       click.trigger="goToNextResult()"
       title="Next Match (Enter)"></np-icon>

    <np-icon name="close" class="action-icon"
       click.trigger="close()"
       title="Close (Escape)"></np-icon>
</template>

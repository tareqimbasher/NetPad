<template class="${isVisible ? 'visible' : ''}">
    <template repeat.for="item of options.items">
        <hr if.bind="item.isDivider" show.bind="item.visible"/>
        <div else
             class="item"
             show.bind="item.visible"
             click.trigger="selectMenuItem(item)">
            <div class="icon" if.bind="hasGlyphs">
                <np-icon name.bind="item.icon"></np-icon>
            </div>
            <div if.bind="!!item.text && typeof item.text === 'function'"
                 class="text"
                 innerHTML.bind="item.text(activeClickTarget)">
            </div>
            <div else
                 class="text"
                 innerHTML.bind="item.text">
            </div>
            <div class="shortcut" show.bind="item.keyLabel">
                ${item.keyLabel}
            </div>
        </div>
    </template>
</template>

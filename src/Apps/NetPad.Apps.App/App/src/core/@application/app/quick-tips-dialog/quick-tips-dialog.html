<template class="quick-tips-dialog">
    <h3 class="main-header d-flex justify-content-between">${'ui.quick-start' | t}<i class="quick-tips-icon"></i>
    </h3>

    <ul class="tips">
        <li>${'ui.write-some-code-and-run-it-with' | t}<kbd>F5</kbd>.</li>
        <li>${'ui.use' | t}<kbd>Ctrl + T</kbd>${'ui.to-go-to-a-script' | t}</li>
        <li>${'ui.use' | t}<kbd>F1</kbd>${'ui.to-open-the-editor-command-palette' | t}</li>
        <li>${'ui.use' | t}<kbd>F12</kbd>${'ui.to-open-settings' | t}<i class="settings-icon"></i>${'ui.where-you-can-review-all-keyboard-shortcuts-and-co' | t}</li>
    </ul>

    <hr/>

    <div class="bottom-bar">
        <div>
            <a href="https://github.com/tareqimbasher/NetPad/issues"
               class="btn btn-info"
               external-link>${'ui.feedback' | t}</a>
        </div>
        <div class="buttons">
            <button class="btn btn-primary" click.trigger="getStarted()">
                ${firstUserVisit ? 'Get Started' : 'Close'}
            </button>
        </div>
    </div>
</template>

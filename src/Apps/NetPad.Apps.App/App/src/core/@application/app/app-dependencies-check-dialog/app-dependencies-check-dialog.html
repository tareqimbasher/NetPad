<template class="app-dependencies-check-dialog dialog-frame dialog-m">
    <div class="dialog-bar">
        <span class="dialog-title">App Dependency Check</span>
    </div>

    <div class="dialog-body">
        <div class="dialog-state" if.bind="loading">
            <spinner></spinner>
            Gathering requirements…
        </div>

        <div class="setting-group" else>
            <div class="setting-row dep-row">
                <np-icon name="check-circle" class="dep-icon text-success"></np-icon>
                <div class="setting-info">
                    <div class="setting-title">.NET Runtime</div>
                    <div class="setting-description">
                        NetPad is running on .NET runtime <code>v${input.dotNetRuntimeVersion}</code>
                    </div>
                </div>
            </div>

            <div class="setting-row dep-row">
                <np-icon name.bind="dotnetSdkMissing ? 'error' : 'check-circle'"
                         class="dep-icon ${dotnetSdkMissing ? 'text-danger' : 'text-success'}"></np-icon>
                <div class="setting-info">
                    <div class="setting-title">.NET SDK</div>

                    <div class="setting-description" if.bind="!report.resolvedPath">
                        No .NET SDK installation was found. Searched:
                        <div class="dep-list">
                            <code repeat.for="step of report.searchSteps">${step.location.path}</code>
                        </div>
                    </div>
                    <template else>
                        <div class="setting-description" if.bind="dotnetSdkMissing">
                            No supported .NET SDK could be found. Install .NET SDK 6 or greater and make sure the
                            <code>dotnet</code> executable is on your <code>PATH</code>.
                        </div>
                        <div class="setting-description" else>
                            <b>${input.supportedDotNetSdkVersionsInstalled.length}</b> supported SDKs installed
                        </div>

                        <div class="dep-list" repeat.for="group of sdkGroups">
                            <code class="dep-path">${group.path}</code>
                            <div class="dep-sdk" repeat.for="sdk of group.sdks">
                                ${sdk.version.string}
                                <span class="chip chip-ok"
                                      if.bind="supportedVersionStrings.has(sdk.version.string)">supported</span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <div class="setting-row dep-row">
                <np-icon name.bind="dotnetEfCoreToolMissing ? 'warning' : 'check-circle'"
                         class="dep-icon ${dotnetEfCoreToolMissing ? 'text-warning' : 'text-success'}"></np-icon>
                <div class="setting-info">
                    <div class="setting-title">Entity Framework Core tool</div>
                    <div class="setting-description" if.bind="dotnetEfCoreToolMissing">
                        Not installed. Optional — needed to add and use database connections.
                    </div>
                    <div class="setting-description" else>
                        Installed, <code>v${input.dotNetEfToolVersion.string}</code>
                    </div>
                </div>
            </div>

            <div class="setting-row dep-row" if.bind="dotnetSdkMissing || dotnetEfCoreToolMissing">
                <np-icon name="info" class="dep-icon text-info"></np-icon>
                <div class="setting-info">
                    <div class="setting-description">
                        Restart NetPad after installing any of the dependencies above.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="window-footer" if.bind="!loading">
        <div class="footer-context-actions">
            <a class="btn ${dotnetSdkMissing ? 'btn-primary' : 'btn-link'}"
               external-link
               href="https://dotnet.microsoft.com/en-us/download/dotnet">
                Download .NET SDK
                <np-icon name="open-external"></np-icon>
            </a>
            <a class="btn btn-link"
               if.bind="dotnetEfCoreToolMissing"
               external-link
               href="https://learn.microsoft.com/en-us/ef/core/cli/dotnet#installing-the-tools">
                Download EF Core tool
                <np-icon name="open-external"></np-icon>
            </a>
        </div>
        <span class="flex-1"></span>
        <button class="btn ${dotnetSdkMissing ? '' : 'btn-primary'}" click.trigger="cancel()">Close</button>
    </div>
</template>

<template class="app-dependencies-check-dialog">
    <h4 class="d-flex justify-content-between">
        <div class="d-flex gap-3">
            <span>${'ui.app-dependency-check' | t}</span>
            <span class="spinner-border float-end" if.bind="loading"></span>
        </div>
        <i class="app-deps-check-icon"></i>
    </h4>

    <div if.bind="!loading">
        <div class="section">
            <h5>
                <i class="check-circle-icon text-green"></i>${'ui.net-runtime' | t}</h5>

            <div class="section-details">${'ui.netpad-is-running-on-net-runtime' | t}<code>v${input.dotNetRuntimeVersion}</code>
            </div>
        </div>

        <div class="section">
            <h5>
                <i class="${dotnetSdkMissing ? 'error-icon text-red' : 'check-circle-icon text-green'}"></i>${'ui.net-sdk' | t}</h5>

            <div class="section-details">
                <div if.bind="!report.resolvedPath">${'ui.could-not-find-a-net-sdk-installation-searched-pat' | t}<ul class="sdk-versions-list">
                        <li repeat.for="step of report.searchSteps">
                            <div class="d-flex align-items-center justify-content-between" style="max-width: 400px">
                                <code>${step.location.path}</code>
                            </div>
                        </li>
                    </ul>
                </div>
                <div else>
                    <div if.bind="dotnetSdkMissing" class="mb-3">
                        <span class="text-red">${'ui.no-supported-net-sdk-could-be-found' | t}</span>
                        <br/>${'ui.make-sure-the-net-sdk-version-6-or-greater-is-inst' | t}<code>dotnet</code>${'ui.executable-is-in-your' | t}<code>PATH</code>.
                    </div>
                    <div else class="mb-3">
                        <b>${input.supportedDotNetSdkVersionsInstalled.length}</b>${'ui.supported-net-sdks-are-installed' | t}</div>

                    <div if.bind="sdkGroups.length">
                        <div repeat.for="group of sdkGroups" class="mb-2">
                            <code class="text-muted">${group.path}</code>
                            <ul class="sdk-versions-list">
                                <li repeat.for="sdk of group.sdks">
                                    <code>${sdk.version.string}</code>
                                    <span class="badge text-green ms-3"
                                          if.bind="supportedVersionStrings.has(sdk.version.string)">${'ui.supported' | t}</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="section">
            <h5>
                <i class="${dotnetEfCoreToolMissing ? 'warning-icon text-yellow' : 'check-circle-icon text-green'}"></i>${'ui.entity-framework-core-net-tool' | t}<small if.bind="!dotnetEfCoreToolMissing">${'ui.installed' | t}<code>v${input.dotNetEfToolVersion.string}</code>)
                </small>
            </h5>

            <div class="section-details">
                <div if.bind="dotnetEfCoreToolMissing">
                    <span>${'ui.entity-framework-core-net-tool-is-not-installed' | t}</span>
                    <br/>
                    <b>${'ui.this-is-optional' | t}</b>${'ui.but-you-will-need-to-install-version-5-or-higher-o' | t}<code>dotnet-ef</code>${'ui.tool-and-ensure-it-is-in-your' | t}<code>PATH</code>${'ui.if-you-want-to-be-able-to-add-and-use-database-con' | t}</div>
                <div else>${'ui.entity-framework-core-net-tool-is-installed' | t}</div>
            </div>
        </div>

        <div class="section"
             if.bind="dotnetSdkMissing || dotnetEfCoreToolMissing">
            <i class="info-icon text-blue"></i>${'ui.please-restart-netpad-after-installing-any-of-the-' | t}</div>
    </div>

    <hr/>

    <div class="bottom-bar" if.bind="loading">
        <span>${'ui.gathering-requirements' | t}</span>
        <div class="buttons">
            <button class="btn btn-primary" click.trigger="cancel()">${'ui.cancel' | t}</button>
        </div>
    </div>
    <div class="bottom-bar" else>
        <div></div>
        <div class="buttons">
            <a class="btn btn-primary"
               external-link
               href="https://dotnet.microsoft.com/en-us/download/dotnet">${'ui.download-net-sdk' | t}</a>
            <a class="btn btn-secondary"
               external-link
               href="https://learn.microsoft.com/en-us/ef/core/cli/dotnet#installing-the-tools">${'ui.download-ef-core-tool' | t}</a>
            <button class="btn-cancel btn btn-secondary" click.trigger="cancel()">${'ui.close' | t}</button>
        </div>
    </div>
</template>
